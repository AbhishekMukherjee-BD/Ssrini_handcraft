<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/admin/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In | SSRINI Handcrafts</title>
  <link rel="stylesheet" href="assets/css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #15182b 0%, #25212d 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .login-card {
      background: #ffffff;
      color: #15182b;
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .brand-logo {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      margin-bottom: 20px;
      object-fit: cover;
    }
    .login-title {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 6px 0;
      color: #15182b;
    }
    .login-subtitle {
      font-size: 14px;
      color: #6c7293;
      margin-bottom: 24px;
    }
    .demo-pill {
      background: #f0ecff;
      border: 1px solid #7357e8;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #5840c7;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #dcdfe8;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      outline: none;
      border-color: #7357e8;
      box-shadow: 0 0 0 3px rgba(115, 87, 232, 0.15);
    }
    .btn-submit {
      width: 100%;
      background: #7357e8;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-submit:hover {
      background: #5840c7;
    }
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
    }
    .login-footer a {
      color: #7357e8;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <img src="assets/images/logo.jpg" alt="SSRINI Handcrafts" class="brand-logo" onerror="this.src='../../ecom/store/assets/images/logo.png'">
    <h1 class="login-title">SSRINI ATELIER</h1>
    <p class="login-subtitle">Master Guild Admin Management Panel</p>

    <div class="demo-pill">
      <strong>✨ Instant Demo Access:</strong><br>
      Pre-filled with master administrator credentials. Click Sign In to enter.
    </div>

    <form id="adminLoginForm">
      <div class="form-group">
        <label class="form-label">Administrator Email</label>
        <input type="email" id="adminEmail" class="form-input" value="admin@ssrini.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="adminPass" class="form-input" value="admin123" required>
      </div>

      <button type="submit" class="btn-submit">Sign In to Dashboard →</button>
    </form>

    <div class="login-footer">
      <a href="/ecom/index.html">← Return to Public Storefront</a>
    </div>
  </div>

  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      sessionStorage.setItem('ssrini_admin_auth', JSON.stringify({
        email: email,
        name: 'Abhishek Mukherjee',
        role: 'Super Administrator',
        loginTime: new Date().toISOString()
      }));
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
