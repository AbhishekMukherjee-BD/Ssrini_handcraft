<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/admin/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders Management | SSRINI Handcrafts</title>
    <link rel="stylesheet" href="assets/css/admin.css">
    <script src="assets/js/admin-data.js"></script>
</head>
<body>
<div class="admin-wrapper">
    
    <!-- SIDEBAR -->
    <aside class="sidebar" id="adminSidebar" aria-label="Admin Navigation">
        <div class="sidebar-brand">
            <a href="/admin/" style="display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit;">
                <img src="assets/images/logo.jpg" alt="SSRINI Handcrafts" style="width:38px; height:38px; border-radius:10px; object-fit:cover;" onerror="this.src='../../ecom/store/assets/images/logo.png'">
                <div>
                    <h2 style="font-size:16px; font-weight:700; color:var(--text-primary); margin:0; line-height:1.2;">SSRINI</h2>
                    <span style="font-size:11px; color:var(--primary); font-weight:600; text-transform:uppercase; letter-spacing:0.5px;">Master Atelier</span>
                </div>
            </a>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-section-title">Navigation</div>
                
        <a href="/admin/" class="nav-item ">
            <span class="nav-icon">📊</span>
            <span>Dashboard</span>
        </a>
        
        <a href="/admin/orders/" class="nav-item active">
            <span class="nav-icon">📦</span>
            <span>Orders</span>
        </a>
        
        <a href="/admin/products/" class="nav-item ">
            <span class="nav-icon">🛍️</span>
            <span>Products</span>
        </a>
        
        <a href="/admin/customers/" class="nav-item ">
            <span class="nav-icon">👥</span>
            <span>Customers</span>
        </a>
        
        <a href="/admin/invoices/" class="nav-item ">
            <span class="nav-icon">📄</span>
            <span>Invoices</span>
        </a>
        
        <a href="/admin/analytics/" class="nav-item ">
            <span class="nav-icon">📈</span>
            <span>Analytics</span>
        </a>
        
        <a href="/admin/reviews/" class="nav-item ">
            <span class="nav-icon">⭐</span>
            <span>Reviews</span>
        </a>
        
        <a href="/admin/settings/" class="nav-item ">
            <span class="nav-icon">⚙️</span>
            <span>Settings</span>
        </a>
        
            </div>
            <div class="nav-section" style="margin-top:auto; padding-top:20px; border-top:1px solid var(--border-light);">
                <a href="/ecom/index.html" class="nav-item" target="_blank" style="color:var(--text-secondary);">
                    <span class="nav-icon">↗</span>
                    <span>View Storefront</span>
                </a>
                <a href="/admin/logout/" class="nav-item" style="color:#e53e3e;">
                    <span class="nav-icon">🚪</span>
                    <span>Sign Out</span>
                </a>
            </div>
        </nav>
    </aside>

    <!-- TOP HEADER -->
    <header class="top-header">
        <div class="header-left">
            <h1 style="font-size: 20px; font-weight: 700; color: var(--text-primary); margin: 0;">Orders & Commission Tracking</h1>
        </div>
        <div class="header-right">
            <button type="button" class="header-button" onclick="window.location.reload();" title="Refresh data">
                🔄 <span>Sync Data</span>
            </button>
            <div class="profile" title="Signed in as Super Administrator">
                <div class="profile-avatar">
                    <img src="assets/images/logo.jpg" alt="SSRINI" style="border-radius:30%; width:100%; height:100%; object-fit:cover;" onerror="this.src='../../ecom/store/assets/images/logo.png'">
                </div>
                <div class="profile-info">
                    <span class="profile-name" id="adminUserDisplay">Abhishek M.</span>
                    <span class="profile-role">Super Admin</span>
                </div>
            </div>
        </div>
    </header>
    

    <main class="main-area">
        <div class="page-content" style="padding: 28px 32px;">
            <div style="background:#fff; border-radius:12px; border:1px solid #e8eaf2; overflow-x:auto;">
                <table style="width:100%; border-collapse:collapse;">
                    <thead>
                        <tr style="background:#fafbfe; border-bottom:1px solid #e8eaf2;">
                            <th style="padding:14px 16px; text-align:left; font-size:12px; color:#6c7293;">Order No</th>
                            <th style="padding:14px 16px; text-align:left; font-size:12px; color:#6c7293;">Collector Name</th>
                            <th style="padding:14px 16px; text-align:left; font-size:12px; color:#6c7293;">Contact</th>
                            <th style="padding:14px 16px; text-align:left; font-size:12px; color:#6c7293;">Destination</th>
                            <th style="padding:14px 16px; text-align:right; font-size:12px; color:#6c7293;">Total</th>
                            <th style="padding:14px 16px; text-align:center; font-size:12px; color:#6c7293;">Payment</th>
                            <th style="padding:14px 16px; text-align:center; font-size:12px; color:#6c7293;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const orders = window.ADMIN_MOCK_DATA ? window.ADMIN_MOCK_DATA.orders : [];
        const tbody = document.getElementById('ordersTableBody');
        tbody.innerHTML = orders.map(o => `
            <tr style="border-bottom:1px solid #f0f2f8;">
                <td style="padding:14px 16px;"><strong>${o.order_number}</strong></td>
                <td style="padding:14px 16px;">${o.customer_name || 'Bespoke Collector'}</td>
                <td style="padding:14px 16px; font-size:13px; color:#666;">${o.customer_phone || 'N/A'}</td>
                <td style="padding:14px 16px; font-size:13px;">${o.shipping_city || 'Kolkata'}, ${o.shipping_state || 'WB'}</td>
                <td style="padding:14px 16px; text-align:right; font-weight:700;">₹${Number(o.total_amount).toLocaleString('en-IN')}</td>
                <td style="padding:14px 16px; text-align:center;">
                    <span style="background:${o.payment_status === 'paid' ? '#e6f9f0' : '#fff8e6'}; color:${o.payment_status === 'paid' ? '#10b981' : '#f59e0b'}; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700;">
                        ${o.payment_status.toUpperCase()}
                    </span>
                </td>
                <td style="padding:14px 16px; text-align:center;">
                    <a href="/ecom/store/invoice.html?order=${o.order_number}" target="_blank" style="color:var(--primary); font-size:13px; font-weight:600; text-decoration:none;">Invoice 📄</a>
                </td>
            </tr>
        `).join('');
    });
</script>
</body>
</html>
