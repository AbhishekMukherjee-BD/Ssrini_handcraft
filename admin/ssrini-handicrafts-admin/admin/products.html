<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Management | SSRINI Handcrafts</title>
    <link rel="stylesheet" href="../assets/css/admin.css">
    <script src="../assets/js/admin-data.js"></script>
    <style>
        .top-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 16px;
            flex-wrap: wrap;
        }
        .search-box {
            flex: 1;
            max-width: 400px;
            padding: 10px 16px;
            border: 1px solid #dcdfe8;
            border-radius: 8px;
            font-size: 14px;
        }
        .btn-add {
            background: var(--primary, #7357e8);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            cursor: pointer;
        }
        .product-thumb {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #e8eaf2;
        }
        .badge-cat {
            background: #f0ecff;
            color: #5840c7;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="admin-wrapper">
    
    <!-- SIDEBAR -->
    <aside class="sidebar" id="adminSidebar" aria-label="Admin Navigation">
        <div class="sidebar-brand">
            <a href="index.html" style="display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit;">
                <img src="../assets/images/logo.jpg" alt="SSRINI Handcrafts" style="width:38px; height:38px; border-radius:10px; object-fit:cover;" onerror="this.src='../../ecom/store/assets/images/logo.png'">
                <div>
                    <h2 style="font-size:16px; font-weight:700; color:var(--text-primary); margin:0; line-height:1.2;">SSRINI</h2>
                    <span style="font-size:11px; color:var(--primary); font-weight:600; text-transform:uppercase; letter-spacing:0.5px;">Master Atelier</span>
                </div>
            </a>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-section-title">Navigation</div>
                
        <a href="index.html" class="nav-item ">
            <span class="nav-icon">📊</span>
            <span>Dashboard</span>
        </a>
        
        <a href="orders.html" class="nav-item ">
            <span class="nav-icon">📦</span>
            <span>Orders</span>
        </a>
        
        <a href="products.html" class="nav-item active">
            <span class="nav-icon">🛍️</span>
            <span>Products</span>
        </a>
        
        <a href="customers.html" class="nav-item ">
            <span class="nav-icon">👥</span>
            <span>Customers</span>
        </a>
        
        <a href="invoices.html" class="nav-item ">
            <span class="nav-icon">📄</span>
            <span>Invoices</span>
        </a>
        
        <a href="analytics.html" class="nav-item ">
            <span class="nav-icon">📈</span>
            <span>Analytics</span>
        </a>
        
        <a href="reviews.html" class="nav-item ">
            <span class="nav-icon">⭐</span>
            <span>Reviews</span>
        </a>
        
        <a href="settings.html" class="nav-item ">
            <span class="nav-icon">⚙️</span>
            <span>Settings</span>
        </a>
        
            </div>
            <div class="nav-section" style="margin-top:auto; padding-top:20px; border-top:1px solid var(--border-light);">
                <a href="/ecom/index.html" class="nav-item" target="_blank" style="color:var(--text-secondary);">
                    <span class="nav-icon">↗</span>
                    <span>View Storefront</span>
                </a>
                <a href="logout.html" class="nav-item" style="color:#e53e3e;">
                    <span class="nav-icon">🚪</span>
                    <span>Sign Out</span>
                </a>
            </div>
        </nav>
    </aside>

    <!-- TOP HEADER -->
    <header class="top-header">
        <div class="header-left">
            <h1 style="font-size: 20px; font-weight: 700; color: var(--text-primary); margin: 0;">Inventory & Artifacts</h1>
        </div>
        <div class="header-right">
            <button type="button" class="header-button" onclick="window.location.reload();" title="Refresh data">
                🔄 <span>Sync Data</span>
            </button>
            <div class="profile" title="Signed in as Super Administrator">
                <div class="profile-avatar">
                    <img src="../assets/images/logo.jpg" alt="SSRINI" style="border-radius:30%; width:100%; height:100%; object-fit:cover;" onerror="this.src='../../ecom/store/assets/images/logo.png'">
                </div>
                <div class="profile-info">
                    <span class="profile-name" id="adminUserDisplay">Abhishek M.</span>
                    <span class="profile-role">Super Admin</span>
                </div>
            </div>
        </div>
    </header>
    

    <main class="main-area">
        <div class="page-content" style="padding: 28px 32px;">
            <div class="top-action-bar">
                <input type="text" id="prodSearch" class="search-box" placeholder="🔍 Search artifacts by title or material...">
                <button class="btn-add" onclick="alert('Artifact creation modal is enabled in static preview!')">✦ Add New Artifact</button>
            </div>

            <div style="background:#fff; border-radius:12px; border:1px solid #e8eaf2; overflow-x:auto;">
                <table style="width:100%; border-collapse:collapse;">
                    <thead>
                        <tr style="background:#fafbfe; border-bottom:1px solid #e8eaf2;">
                            <th style="padding:14px 16px; text-align:left; font-size:12px; color:#6c7293;">Image</th>
                            <th style="padding:14px 16px; text-align:left; font-size:12px; color:#6c7293;">Title & Badge</th>
                            <th style="padding:14px 16px; text-align:left; font-size:12px; color:#6c7293;">Category</th>
                            <th style="padding:14px 16px; text-align:left; font-size:12px; color:#6c7293;">Material</th>
                            <th style="padding:14px 16px; text-align:right; font-size:12px; color:#6c7293;">Price</th>
                            <th style="padding:14px 16px; text-align:center; font-size:12px; color:#6c7293;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody">
                        <!-- Populated dynamically from admin-data.js -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const prods = window.ADMIN_MOCK_DATA ? window.ADMIN_MOCK_DATA.products : [];
        const tbody = document.getElementById('productsTableBody');
        
        const render = (list) => {
            tbody.innerHTML = list.map(p => `
                <tr style="border-bottom:1px solid #f0f2f8;">
                    <td style="padding:12px 16px;">
                        <img src="${p.images[0]}" class="product-thumb" alt="${p.title}">
                    </td>
                    <td style="padding:12px 16px;">
                        <strong>${p.title}</strong><br>
                        <span style="font-size:11px; color:#c5a059;">✦ ${p.badge || 'Artisanal'}</span>
                    </td>
                    <td style="padding:12px 16px;">
                        <span class="badge-cat">${p.category}</span>
                    </td>
                    <td style="padding:12px 16px; font-size:13px; color:#555;">
                        ${p.material}
                    </td>
                    <td style="padding:12px 16px; text-align:right; font-weight:700;">
                        ₹${p.priceINR.toLocaleString('en-IN')}
                    </td>
                    <td style="padding:12px 16px; text-align:center;">
                        <a href="/ecom/store/product.html?id=${p.slug}" target="_blank" style="color:var(--primary); text-decoration:none; font-weight:600; font-size:13px;">View Live ↗</a>
                    </td>
                </tr>
            `).join('');
        };
        render(prods);

        document.getElementById('prodSearch').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = prods.filter(p => p.title.toLowerCase().includes(q) || p.material.toLowerCase().includes(q));
            render(filtered);
        });
    });
</script>
</body>
</html>
